<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swarm Edit Reel</title>
<style>
  :root { --bg:#000; --fg:#ddd; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,Helvetica,Arial,sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{height:100vh;width:auto;max-width:100vw;aspect-ratio:9/16;object-fit:contain;display:block}
  #hint{position:fixed;left:12px;bottom:10px;font:12px/1.4 monospace;color:#777;transition:opacity .6s}
  body.capture #hint{display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="hint">пробел — пауза · R — заново · перетащите своё видео на страницу, чтобы вставить его в монитор</div>
<script>
/* ============ НАСТРОЙКИ — меняйте тексты здесь ============ */
const CONFIG = {
  title: "Opus 5.5 + Higgsfield =",   // заголовок сверху (после него рисуется огонь)
  fire: true,
  subtitle: "10 AI-агентов монтируют один рилс",
  project: "swarm_reel_v1",
  phrases: ["10 АГЕНТОВ", "МОНТИРУЮТ ОДИН РИЛС", "В РЕАЛЬНОМ ВРЕМЕНИ", "СУБТИТРЫ · ЦВЕТ · ЗВУК", "ВСЁ ОДНОВРЕМЕННО", "ГОТОВО ЗА 30 СЕКУНД"],
  duration: 28,
};
/* ========================================================== */

const W = 1080, H = 1920, DUR = CONFIG.duration;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const SANS = 'Inter, "Helvetica Neue", Helvetica, Arial, sans-serif';
const MONO = '"JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace';

// ---------- helpers ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20261115);
const R = (a,b)=>a+rnd()*(b-a);
const RI = (a,b)=>Math.floor(R(a,b+1));
const pick = arr => arr[Math.floor(rnd()*arr.length)];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const easeOut=k=>1-Math.pow(1-k,3);
const pad=n=>String(Math.floor(n)).padStart(2,'0');
const tc=t=>`${pad(t/60)}:${pad(t%60)}`;
const tcf=t=>`00:00:${pad(t)}:${pad((t%1)*30)}`;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function fillRR(x,y,w,h,r,c){rr(x,y,w,h,r);ctx.fillStyle=c;ctx.fill()}
function strokeRR(x,y,w,h,r,c,lw=1){rr(x,y,w,h,r);ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.stroke()}
function txt(s,x,y,font,color,align='left',base='alphabetic'){ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline=base;ctx.fillText(s,x,y)}
function fit(s,maxW){if(ctx.measureText(s).width<=maxW)return s;while(s.length>1&&ctx.measureText(s+'…').width>maxW)s=s.slice(0,-1);return s+'…'}
function noise(x){return Math.sin(x*12.9898)*43758.5453%1}

// ---------- layout ----------
const EY = 300;               // editor top
const TL = {x0:90, x1:1050, sec:15};
const tlX = s => TL.x0 + s/TL.sec*(TL.x1-TL.x0);
const PROG = {x:312, y:380, w:316, h:562};
const REG = {
  PROG_LOW:[335,760,270,150], PROG:[335,420,270,470], CAPS:[660,850,390,170], CAPTRK:[95,1170,950,20],
  COLOR:[870,585,185,200], SCOPE:[660,585,185,200], BIN:[25,385,255,160], V2:[95,1094,950,26],
  V1:[95,1130,950,32], SFX:[95,1276,950,18], LOUD:[320,1002,300,40], A1:[95,1200,950,34],
  A2:[95,1243,950,24], WAVE:[660,365,395,180],
};
const ROLE_REG = {
  caps:['PROG_LOW','CAPS','CAPTRK','CAPTRK','CAPTRK'], grade:['COLOR','COLOR','COLOR','SCOPE','PROG'],
  broll:['BIN','V2'], razor:['V1'], sfx:['SFX','SFX','BIN'], mix:['LOUD','A1','A2','A2'], gfx:['PROG','PROG_LOW','WAVE'],
};
const AG = [
  {id:'caps-01', c:'#ffd23f', role:'caps'},  {id:'caps-02', c:'#ff9f1c', role:'caps'},
  {id:'grade-01',c:'#ff5d8f', role:'grade'}, {id:'grade-02',c:'#c77dff', role:'grade'},
  {id:'broll-01',c:'#4cc9f0', role:'broll'}, {id:'broll-02',c:'#5e8bff', role:'broll'},
  {id:'razor-01',c:'#ff3d7f', role:'razor'}, {id:'sfx-01',  c:'#5cf2c1', role:'sfx'},
  {id:'mix-01',  c:'#b8f400', role:'mix'},   {id:'gfx-01',  c:'#ff7b54', role:'gfx'},
];
const SLIDERS = ['Temp','Tint','Contrast','Saturation','Exposure'];
const SL_BASE = [0.32,0.5,0.42,0.36,0.4], SL_GOAL=[0.64,0.53,0.6,0.56,0.56];
const SL_MSG = ['temp → 5600K','tint +2','contrast +0.12','saturation +0.08','exposure +0.3'];
const CAP_STYLES = ['Lime Gradient','Karaoke','Bold Pop','Mono Type'];
const FONTS = ['Inter Black','Helvetica Neue Bold','Mono Type','Arial Bold — too plain ✗'];
const WORDS = CONFIG.phrases.join(' ').split(/\s+/).filter(w=>w.length>1);

// ---------- build deterministic schedule ----------
const T_QA = 21, T_EX = 23.5;
const S = { events:[], capClips:[], v2:[], cuts:[], sfx:[], grade:[], broll:[], punch:[], capStyle:[], duck:[] };
function occupied(list,x,w){return list.some(c=>x<c.x+c.w+6 && x+w>c.x-6)}
function ev(t,a,msg){S.events.push({t,a,msg})}

AG.forEach((a,i)=>{
  a.wp=[]; a.dwell=[]; a.clicks=[];
  const sx=540+R(-30,30), sy=820+R(-30,30), st=0.25+i*0.08;
  a.spawn=st; a.wp.push({t:st,x:sx,y:sy});
  ev(st+0.05,a,'connected · role: '+a.role);
  let cur={x:sx,y:sy}, t=st+0.55+R(0,.4), k=0;
  while(t<T_QA-0.4){
    const regs=ROLE_REG[a.role]; const rn=a.role==='broll'?regs[k%2]:pick(regs);
    const r=REG[rn]; const x=R(r[0],r[0]+r[2]), y=R(r[1],r[1]+r[3]);
    const mv=0.38+R(0,.35)+Math.hypot(x-cur.x,y-cur.y)/2600;
    const at=t+mv;
    a.wp.push({t,x:cur.x,y:cur.y},{t:at,x,y}); a.clicks.push({t:at,x,y});
    const dw=0.45+R(0,.75); a.dwell.push({t0:at,t1:at+dw,rn,x,y});
    action(a,rn,at,x,y,k);
    cur={x,y}; t=at+dw; k++;
  }
  // QA
  for(let q=0;q<2;q++){
    const r=REG[pick(ROLE_REG[a.role])]; const x=R(r[0],r[0]+r[2]), y=R(r[1],r[1]+r[3]);
    const t0=Math.max(t,T_QA+q*1.15+i*0.04), at=t0+0.5;
    a.wp.push({t:t0,x:cur.x,y:cur.y},{t:at,x,y}); a.clicks.push({t:at,x,y});
    ev(at,a,'QA ✓ '+pick({caps:['captions in sync','safe-zone ok'],grade:['skin tones','no clipping'],broll:['b-roll timing','no gaps'],razor:['no jump cuts','pacing 2.1 cuts/s'],sfx:['sfx levels'],mix:['−14.1 LUFS','true peak −1 dB'],gfx:['motion smooth','text readable']}[a.role]));
    cur={x,y}; t=at+0.3;
  }
  // export ring
  const ang=-Math.PI/2+i/AG.length*Math.PI*2, ex=540+Math.cos(ang)*395, ey=800+Math.sin(ang)*175;
  const t0=Math.max(t,T_EX+0.1+i*0.05);
  a.wp.push({t:t0,x:cur.x,y:cur.y},{t:t0+0.6,x:ex,y:ey});
  a.ring={x:ex,y:ey,t:t0+0.6};
  ev(24.1+(i+1)*0.31,a,`render chunk ${i+1}/10 ✓`);
});
ev(T_EX+0.05,{id:'swarm',c:'#ffffff'},'render: split into 10 chunks');
ev(27.45,{id:'swarm',c:'#c6ff00'},'reel_final.mp4 exported ✓');

function action(a,rn,t,x,y,k){
  const ts=((x-TL.x0)/(TL.x1-TL.x0))*TL.sec;
  switch(a.role){
    case 'caps':
      if(rn==='CAPTRK'){const w=R(40,95);const cx=clamp(x-w/2,TL.x0,TL.x1-w);
        if(!occupied(S.capClips,cx,w)) S.capClips.push({t,x:cx,w,a});
        ev(t,a,`caption "${pick(WORDS).toLowerCase()}" in ${RI(90,240)}ms`);}
      else if(rn==='CAPS'){const s=RI(0,3);S.capStyle.push({t,s});ev(t,a,'style: '+CAP_STYLES[s]+' · '+pick(FONTS));}
      else ev(t,a,`caption pos y ${RI(64,72)}% · safe-zone`);
      break;
    case 'grade':
      if(rn==='COLOR'){const s=RI(0,4);S.grade.push({t,s});ev(t,a,SL_MSG[s]);}
      else if(rn==='SCOPE'){S.grade.push({t,s:RI(0,4)});ev(t,a,'skin tone matched ✓');}
      else {S.grade.push({t,s:RI(0,4)});ev(t,a,rnd()<.5?`match shot ${RI(2,7)} → A`:'LUT: HF Warm Commercial');}
      break;
    case 'broll':
      if(rn==='BIN') ev(t,a,`pick broll_0${RI(1,9)}.mov`);
      else {const w=R(70,140);const cx=clamp(x-w/2,TL.x0,TL.x1-w);
        if(!occupied(S.v2,cx,w)){S.v2.push({t,x:cx,w,a});S.broll.push({t,a});}
        ev(t,a,`placed broll_0${RI(1,9)}.mov @ ${tc(ts)}`);}
      break;
    case 'razor': S.cuts.push({t,x}); ev(t,a,pick([`removed breath ${R(.2,.6).toFixed(1)}s`,'cut filler "эм"',`tightened pause −${RI(3,12)}f`,'jump cut → j-cut'])); break;
    case 'sfx': if(rn==='SFX'){S.sfx.push({t,x,a});ev(t,a,`${pick(['whoosh_01','pop_02','riser_01','click_03','swish_04'])}.wav @ ${tc(ts)}`);} else ev(t,a,'pick sfx pack: Punchy'); break;
    case 'mix': if(rn==='A2'){S.duck.push({t,x});ev(t,a,'music duck −6 dB under voice');} else ev(t,a,pick(['voice −14 LUFS','de-ess 6.2 kHz','limiter −1 dBTP','EQ: low-cut 80 Hz'])); break;
    case 'gfx': S.punch.push({t}); ev(t,a,pick(['punch-in 112%','shake on beat','glow on caption','zoom ease-out 0.4s'])); break;
  }
}
S.events.sort((p,q)=>p.t-q.t);
const GRADE_TOTAL = S.grade.length;

function agentPos(a,t){
  const w=a.wp; if(t<=w[0].t) return {x:w[0].x,y:w[0].y,moving:false};
  for(let i=0;i<w.length-1;i++){
    const p=w[i],q=w[i+1];
    if(t>=p.t&&t<q.t){
      if(p.x===q.x&&p.y===q.y) break;
      const k=ease((t-p.t)/(q.t-p.t)); return {x:lerp(p.x,q.x,k),y:lerp(p.y,q.y,k),moving:true};
    }
  }
  // dwelling: find last waypoint <= t
  let last=w[0]; for(const p of w){ if(p.t<=t) last=p; }
  const j=a.id.length*1.7;
  return {x:last.x+Math.sin(t*5+j)*2.5, y:last.y+Math.cos(t*4.3+j)*2, moving:false};
}

// ---------- user video (optional, live mode) ----------
let userVideo=null;
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(!f||!f.type.startsWith('video'))return;
  const v=document.createElement('video');v.src=URL.createObjectURL(f);v.muted=true;v.loop=true;v.playsInline=true;v.play();userVideo=v;});

// ---------- drawing: program monitor ----------
function gradeK(t){let n=0;for(const g of S.grade) if(g.t<=t) n++; return GRADE_TOTAL?n/GRADE_TOTAL:0}
function drawPresenter(x,y,w,h,t,g){
  // wall
  let gr=ctx.createLinearGradient(x,y,x+w,y+h);
  gr.addColorStop(0,'#e3d3bd');gr.addColorStop(1,'#a88e74');ctx.fillStyle=gr;ctx.fillRect(x,y,w,h);
  // window light
  gr=ctx.createLinearGradient(x,y,x+w*.4,y);gr.addColorStop(0,'rgba(255,250,235,.85)');gr.addColorStop(1,'rgba(255,250,235,0)');
  ctx.fillStyle=gr;ctx.fillRect(x,y,w*.45,h*.75);
  // shelf
  const sx=x+w*.62, sy=y+h*.2;
  ctx.fillStyle='#6b5240';ctx.fillRect(sx,sy+46,w*.36,5);ctx.fillRect(sx,sy+112,w*.36,5);
  const bc=['#9b2c2c','#2c5282','#d69e2e','#276749','#553c9a','#c05621','#2a4365'];
  for(let r=0;r<2;r++){let bx=sx+4;for(let b=0;b<7;b++){const bw=6+((b*7+r*3)%5)*2,bh=26+((b*5+r)%4)*5;ctx.fillStyle=bc[(b+r*2)%7];ctx.fillRect(bx,sy+46+r*66-bh,bw,bh);bx+=bw+2;}}
  // plant
  ctx.fillStyle='#4a6b3a';for(let l=0;l<6;l++){ctx.beginPath();ctx.ellipse(x+w*.18+Math.cos(l)*14,y+h*.22+Math.sin(l*2)*8,12,5,l,0,7);ctx.fill();}
  ctx.fillStyle='#8a6a52';ctx.fillRect(x+w*.14,y+h*.25,26,24);
  // person
  const talk=Math.abs(Math.sin(t*8.5))*(0.5+0.5*Math.sin(t*1.9));
  const cx=x+w*.5+Math.sin(t*1.3)*4, by=y+h, hy=y+h*.46+Math.sin(t*2.1)*3;
  ctx.fillStyle='#232328';ctx.beginPath();ctx.moveTo(cx-w*.48,by);ctx.bezierCurveTo(cx-w*.46,hy+h*.2,cx-w*.25,hy+h*.14,cx,hy+h*.15);
  ctx.bezierCurveTo(cx+w*.25,hy+h*.14,cx+w*.46,hy+h*.2,cx+w*.48,by);ctx.fill();
  ctx.strokeStyle='#3a3a42';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx-22,hy+h*.17);ctx.quadraticCurveTo(cx,hy+h*.22,cx+22,hy+h*.17);ctx.stroke();
  ctx.fillStyle='#b98466';ctx.fillRect(cx-16,hy+48,32,40);
  ctx.fillStyle='#c99a78';ctx.beginPath();ctx.ellipse(cx,hy+18,44,56,0,0,7);ctx.fill();
  ctx.fillStyle='#1d1612';for(let c=0;c<9;c++){ctx.beginPath();ctx.arc(cx-38+c*9.5,hy-30+Math.sin(c*1.7)*7,15,0,7);ctx.fill();}
  ctx.fillStyle='#2a1d17';ctx.beginPath();ctx.arc(cx-16,hy+12,3.4,0,7);ctx.arc(cx+16,hy+12,3.4,0,7);ctx.fill();
  ctx.fillStyle='#4a2620';ctx.beginPath();ctx.ellipse(cx,hy+44,11,2+talk*8,0,0,7);ctx.fill();
  // desk
  gr=ctx.createLinearGradient(0,by-h*.12,0,by);gr.addColorStop(0,'#9a6b45');gr.addColorStop(1,'#6b4429');ctx.fillStyle=gr;ctx.fillRect(x,by-h*.1,w,h*.1);
  // grade: cool/flat -> warm/punchy
  ctx.fillStyle=`rgba(90,110,140,${0.38*(1-g)})`;ctx.fillRect(x,y,w,h);
  ctx.globalCompositeOperation='soft-light';ctx.fillStyle=`rgba(255,150,60,${0.45*g})`;ctx.fillRect(x,y,w,h);ctx.globalCompositeOperation='source-over';
}
function drawProgram(t){
  const {x,y,w,h}=PROG, g=gradeK(t);
  fillRR(x-4,y-4,w+8,h+8,6,'#0c0c10');
  ctx.save();rr(x,y,w,h,4);ctx.clip();
  let z=1; for(const p of S.punch){const d=t-p.t; if(d>=0&&d<0.9) z+=0.07*Math.sin(clamp(d/0.9)*Math.PI);}
  ctx.translate(x+w/2,y+h/2);ctx.scale(z,z);ctx.translate(-(x+w/2),-(y+h/2));
  if(userVideo&&userVideo.readyState>=2){const vw=userVideo.videoWidth,vh=userVideo.videoHeight,s=Math.max(w/vw,h/vh);ctx.drawImage(userVideo,x+(w-vw*s)/2,y+(h-vh*s)/2,vw*s,vh*s);
    ctx.fillStyle=`rgba(90,110,140,${0.3*(1-g)})`;ctx.fillRect(x,y,w,h);}
  else drawPresenter(x,y,w,h,t,g);
  ctx.setTransform(1,0,0,1,0,0);
  // b-roll card
  for(const b of S.broll){const d=t-b.t; if(d<0||d>1.7) continue;
    const k=d<.3?easeOut(d/.3):d>1.4?1-easeOut((d-1.4)/.3):1;
    const cx=x+18, cy=y+30-(1-k)*120, cw=w-36, ch=150;
    ctx.globalAlpha=k;fillRR(cx,cy,cw,ch,10,'#14161c');strokeRR(cx,cy,cw,ch,10,b.a.c,2);
    fillRR(cx,cy,cw,20,10,'#22252e');['#ff5f57','#febc2e','#28c840'].forEach((c,i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(cx+14+i*12,cy+10,4,0,7);ctx.fill()});
    for(let l=0;l<6;l++){fillRR(cx+14,cy+32+l*18,(cw-28)*(0.35+((l*37+Math.floor(b.t*10))%60)/100),8,4,l%3?'#3a3f4c':b.a.c);}
    ctx.globalAlpha=1;}
  // captions
  drawCaptions(t);
  ctx.restore();
  // selection boxes from dwelling agents
  for(const a of AG) for(const d of a.dwell){ if(t<d.t0||t>d.t1||!(d.rn==='PROG'||d.rn==='PROG_LOW')) continue;
    const bw=150,bh=54,bx=clamp(d.x-bw/2,x+4,x+w-bw-4),by=clamp(d.y-bh/2,y+4,y+h-bh-4);
    ctx.setLineDash([6,4]);strokeRR(bx,by,bw,bh,3,a.c,2);ctx.setLineDash([]);
    [[bx,by],[bx+bw,by],[bx,by+bh],[bx+bw,by+bh]].forEach(([px,py])=>{ctx.fillStyle='#fff';ctx.fillRect(px-3,py-3,6,6)});
    txt(`${Math.round(bw*3.4)}×${Math.round(bh*3.4)}`,bx+bw/2,by+bh+16,`600 11px ${MONO}`,a.c,'center');}
  // header + tc
  txt('PROGRAM',x,y-14,`600 12px ${MONO}`,'#8a8f9c');
  txt(t>T_EX?'rendering':'playing',x+70,y-14,`12px ${MONO}`,'#5c6170');
  const ph=playhead(t); fillRR(x+w-108,y-30,108,22,4,'#1c2a12');txt(tcf(ph),x+w-54,y-14,`600 12px ${MONO}`,'#c6ff00','center');
}
function drawCaptions(t){
  if(t<2.6) return;
  const ph=CONFIG.phrases, per=(T_EX-2.6)/ph.length;
  let i=Math.floor((t-2.6)/per); if(i>=ph.length) i=ph.length-1;
  const lt=t-2.6-i*per, words=ph[i].split(' ');
  let style=0; for(const c of S.capStyle) if(c.t<=t) style=c.s;
  const nShow=Math.min(words.length,Math.floor(lt/(per*0.55/words.length))+1);
  const fs=style===2?40:style===3?30:36;
  const font=style===3?`700 ${fs}px ${MONO}`:style===2?`900 ${fs}px ${SANS}`:`800 ${fs}px ${SANS}`;
  ctx.font=font;
  // wrap
  const lines=[[]];let lw=0;const maxW=PROG.w-30;
  words.forEach((wd,j)=>{const ww=ctx.measureText(wd+' ').width;if(lw+ww>maxW&&lines[lines.length-1].length){lines.push([]);lw=0;}lines[lines.length-1].push({wd,j,ww});lw+=ww;});
  const cy0=PROG.y+PROG.h*0.66-(lines.length-1)*fs*0.6;
  lines.forEach((ln,li)=>{
    const tw=ln.reduce((s,o)=>s+o.ww,0); let cx=PROG.x+PROG.w/2-tw/2;
    ln.forEach(o=>{
      if(o.j<nShow){
        const appear=clamp((lt-o.j*(per*0.55/words.length))/0.18); const cur=o.j===nShow-1;
        const sc=style===2?lerp(1.35,1,easeOut(appear)):1;
        const wx=cx, wy=cy0+li*fs*1.15;
        ctx.save();ctx.translate(wx+o.ww/2,wy);ctx.scale(sc,sc);ctx.globalAlpha=appear;
        if(style===1&&cur){ctx.fillStyle='#ffd23f';rr(-o.ww/2-4,-fs*.82,o.ww-2,fs*1.05,6);ctx.fill();}
        ctx.font=font;ctx.textAlign='center';ctx.textBaseline='alphabetic';
        ctx.lineWidth=7;ctx.strokeStyle='rgba(0,0,0,.85)';ctx.lineJoin='round';
        if(!(style===1&&cur))ctx.strokeText(o.wd,-ctx.measureText(' ').width/2,0);
        ctx.fillStyle=style===1&&cur?'#111':cur&&style!==3?'#c6ff00':'#fff';
        ctx.fillText(o.wd,-ctx.measureText(' ').width/2,0);ctx.restore();
      }
      cx+=o.ww;
    });
  });
}
function playhead(t){ if(t>T_EX) return clamp((t-T_EX-0.3)/3.6)*TL.sec; return (t*0.85)%TL.sec; }

// ---------- panels ----------

      const xb1=540-rowHalf(yb)+(c/cols)*2*rowHalf(yb)+3, xb2=540-rowHalf(yb)+((c+span)/cols)*2*rowHalf(yb)-3;
      const hue=(c*22+r*14-t*140)%360;
      ctx.fillStyle=`hsla(${hue},100%,58%,.28)`;ctx.beginPath();ctx.moveTo(xa1-5,ya-5);ctx.lineTo(xa2+5,ya-5);ctx.lineTo(xb2+6,yb+6);ctx.lineTo(xb1-6,yb+6);ctx.fill();
      ctx.fillStyle=`hsl(${hue},95%,${46+8*Math.sin(t*3+c)}%)`;ctx.beginPath();ctx.moveTo(xa1,ya);ctx.lineTo(xa2,ya);ctx.lineTo(xb2,yb);ctx.lineTo(xb1,yb);ctx.fill();
      const qx=[xa1,xa2,xb2,xb1],qy=[ya,ya,yb,yb],mx=(xa1+xa2+xb1+xb2)/4,my=(ya+yb)/2,sh=0.8;
      ctx.fillStyle='rgba(8,10,18,.72)';ctx.beginPath();for(let q=0;q<4;q++){const px=mx+(qx[q]-mx)*sh,py=my+(qy[q]-my)*sh-2;q?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.fill();
    }}
}

// ---------- frame ----------
function renderAt(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  drawHeader(t);
  ctx.save();
  ctx.beginPath();ctx.rect(0,EY,W,1020);ctx.clip();
  ctx.translate(Math.sin(t*1.7)*1.5,Math.cos(t*1.3)*1.2); // hand-held feel
  ctx.fillStyle='#0b0c10';ctx.fillRect(-10,EY,W+20,1020);
  drawMenu(t);drawBin(t);drawLog(t);drawProgram(t);drawStatus(t);drawWave(t);drawScope(t);drawColor(t);drawCapsPanel(t);drawTimeline(t);
  drawExport(t);
  AG.forEach(a=>drawCursor(a,t));
  // screen look: scanlines + vignette
  ctx.fillStyle='rgba(255,255,255,.018)';for(let y=EY;y<EY+1020;y+=4)ctx.fillRect(0,y,W,1);
  const vg=ctx.createRadialGradient(540,810,300,540,810,800);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=vg;ctx.fillRect(0,EY,W,1020);
  ctx.restore();
  drawDesk(t);
}
window.renderAt=renderAt; window.DURATION=DUR;

// ---------- live loop ----------
const capture=new URLSearchParams(location.search).has('capture');
if(capture){document.body.classList.add('capture');renderAt(0);}
else{
  let start=performance.now(),paused=false,pt=0;
  addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;if(!paused)start=performance.now()-pt*1000;}if(e.key==='r'||e.key==='R'){start=performance.now();}});
  setTimeout(()=>document.getElementById('hint').style.opacity=0,5000);
  (function loop(now){if(!paused){pt=((now-start)/1000)%(DUR+1.5);}renderAt(Math.min(pt,DUR));requestAnimationFrame(loop);})(performance.now());
}
</script>
</body>
